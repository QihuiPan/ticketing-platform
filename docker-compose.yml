name: ticketing-platform

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketing} -d ${POSTGRES_DB:-ticketing}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketing}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${BIND_ADDRESS:-127.0.0.1}:4318:4318"
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketing}
      DATABASE_USER: ${POSTGRES_USER:-ticketing}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-ticketing}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketing}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-now}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_BUYER_PASSWORD: ${DEMO_BUYER_PASSWORD:-DemoBuyer123!}
      DEMO_ORGANIZER_PASSWORD: ${DEMO_ORGANIZER_PASSWORD:-DemoOrganizer123!}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  notification-worker:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketing}
      DATABASE_USER: ${POSTGRES_USER:-ticketing}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-ticketing}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketing}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_DEMO_BUYER_PASSWORD: ${DEMO_BUYER_PASSWORD:-DemoBuyer123!}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    depends_on:
      - api
      - notification-worker
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  k6:
    image: grafana/k6:1.2.3
    profiles: ["load-test"]
    environment:
      BASE_URL: http://api:8080
      DEMO_BUYER_PASSWORD: ${DEMO_BUYER_PASSWORD:-DemoBuyer123!}
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  grafana-data:
