global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: ticketing-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  - job_name: notification-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-worker:8081"]
