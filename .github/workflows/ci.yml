name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and integration tests
        run: ./mvnw --batch-mode verify

  web:
    name: Web verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  changelog:
    name: Changelog policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changelog update
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx CHANGELOG.md

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Validate production Terraform
        run: |
          terraform -chdir=infra/aws init -backend=false
          terraform -chdir=infra/aws validate
      - name: Validate demo Terraform
        run: |
          terraform -chdir=infra/aws-demo init -backend=false
          terraform -chdir=infra/aws-demo validate
      - name: Validate demo Compose configuration
        run: docker compose --env-file infra/aws-demo/runtime/.env.example -f infra/aws-demo/runtime/docker-compose.yml config --quiet
      - name: Validate shell helpers
        run: bash -n scripts/quickstart.sh
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @("infra/aws-demo/scripts/deploy.ps1", "scripts/quickstart.ps1")) {
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  compose-smoke:
    name: Fresh-install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and start the user-facing stack
        run: docker compose --env-file .env.example up --build --detach --wait api notification-worker web
      - name: Exercise the complete booking journey
        run: docker compose --env-file .env.example --profile load-test run --rm k6 run /scripts/smoke.js
      - name: Capture diagnostics
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail 200 api notification-worker web postgres rabbitmq redis
      - name: Remove test resources
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  container-images:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t ticketing-api:${{ github.sha }} .
      - name: Build notification worker image
        run: docker build -f apps/notification-worker/Dockerfile -t notification-worker:${{ github.sha }} .
      - name: Build web image
        run: docker build -t ticketing-web:${{ github.sha }} web
