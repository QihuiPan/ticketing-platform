name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and integration tests
        run: ./mvnw --batch-mode verify

  web:
    name: Web verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  changelog:
    name: Changelog policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changelog update
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx CHANGELOG.md

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Validate production Terraform
        run: |
          terraform -chdir=infra/aws init -backend=false
          terraform -chdir=infra/aws validate
      - name: Validate demo Terraform
        run: |
          terraform -chdir=infra/aws-demo init -backend=false
          terraform -chdir=infra/aws-demo validate
      - name: Validate demo Compose configuration
        run: docker compose --env-file infra/aws-demo/runtime/.env.example -f infra/aws-demo/runtime/docker-compose.yml config --quiet
      - name: Parse the deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "infra/aws-demo/scripts/deploy.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  container-images:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t ticketing-api:${{ github.sha }} .
      - name: Build notification worker image
        run: docker build -f apps/notification-worker/Dockerfile -t notification-worker:${{ github.sha }} .
      - name: Build web image
        run: docker build -t ticketing-web:${{ github.sha }} web
